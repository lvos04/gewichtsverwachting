name: Versie-image publiceren
# Tags v* → versie-image (ongewijzigd, inclusief het automatische latest-gedrag van
# docker/metadata-action voor tags).
# Handmatig (workflow_dispatch, vanaf elke branch) → testimage met de tags
# `preview`, `sha-<korte commit>` en `<versie>-rc` (versie uit app/__init__.py).
# Een handmatige run zet nooit `latest`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Versie uit één bron lezen
        id: versie
        run: echo "versie=$(python3 -c "import re; print(re.search(r'__version__ = .([0-9][^\"\x27]*)', open('app/__init__.py').read())[1])")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ github.event_name == 'workflow_dispatch' && 'false' || 'auto' }}
          tags: |
            type=ref,event=tag
            type=raw,value=preview,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.versie.outputs.versie }}-rc,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: '${{ steps.meta.outputs.tags }}'
          labels: '${{ steps.meta.outputs.labels }}'
